      Authorization:
      - Bearer github-token
    method: GET
    uri: http://localhost/api/auth/token-login
  response:
    body:
      string: '{}'
    headers:
      Content-Type:
      - application/json
      Set-Cookie:
      - session=abc123; Path=/
